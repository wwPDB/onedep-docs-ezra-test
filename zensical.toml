[project]
site_url = "https://wwpdb.github.io/onedep-docs-ezra-test"
site_name = "OneDep Documentation"
# site_description = "Your project description"
site_author = "Ezra Peisach"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/wwPDB/onedep-docs-ezra-test"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "Get started" = "index.md" },
  { "Markdown in 5min" = "markdown.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
name = "wwpdb_onedep_theme"
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["modules/py-wwpdb_utils_config",
         "modules/py-wwpdb_utils_session",
	 "modules/py-wwpdb_io"]

[project.plugins.mkdocstrings.handlers.python.options]
show_if_no_docstring = true
# Exclude all private/protected (_name) and special (__name__) objects
filters = ["!^_"]

# OR: Exclude private/protected (_name), but keep special/dunder (__init__) methods (Default)
# filters = ["!^_[^_]"]

[project.plugins.api-autonav]
modules = ["modules/py-wwpdb_utils_config/wwpdb",
           "modules/py-wwpdb_utils_session/wwpdb",
           "modules/py-wwpdb_io/wwpdb",	   
          ]
exclude_private = true

exclude = ["wwpdb.utils.config.ConfigInfoFileExec",
           "wwpdb.utils.config.ConfigInfoShellExec",
           "wwpdb.utils.config.ConfigInfoDataSetExec"	   
           ]

nav_section_title = "API Reference"
on_implicit_namespace_package = "warn" # Options: "warn", "ignore", or "raise"
#show_full_namespace = true

